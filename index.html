<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeatWise | Admin Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box} :root{--primary-blue:#1f5fbf;--dark-blue:#16499a;--light-blue:#edf4ff;--border-blue:#2b70d4;--white:#fff;--text-dark:#1e293b;--text-grey:#667085;--border-grey:#d8e0ea;--error-bg:#fff1ef;--error-text:#bd3d31;--success-bg:#edf9f0;--success-text:#218342}
        body{font-family:Inter,Arial,Helvetica,sans-serif;min-height:100vh;background:radial-gradient(circle at 0 100%,#b8d2fa 0,#dce9fb 20%,transparent 20.5%),radial-gradient(circle at 100% 0,#dfe9f8 0,transparent 20%),linear-gradient(135deg,#eaf1fb,#f8fafc);color:var(--text-dark)}
        button{font-family:inherit;cursor:pointer}.login-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px}.login-container{width:100%;max-width:1120px;min-height:650px;display:grid;grid-template-columns:38% 62%;background:#fff;border-radius:22px;overflow:hidden;border:1px solid #dce4ef;box-shadow:0 25px 60px rgba(28,56,95,.18)}
        .brand-panel{position:relative;overflow:hidden;padding:65px 40px 80px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(to bottom,#f6f9ff 0,#e8f0fc 74%,#1c58b5 74%)}
        .brand-content{text-align:center;position:relative;z-index:2}.school-logo{width:108px;height:108px;margin:0 auto 28px;border:3px solid var(--primary-blue);border-radius:30px 30px 45px 45px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--primary-blue)}.school-logo:before{content:"▰";position:absolute;font-size:48px;transform:translateY(-3px)}.school-logo:after{content:"★ ★ ★";position:absolute;top:10px;font-size:9px;letter-spacing:4px}.brand-title{font-size:46px;font-weight:800;letter-spacing:-2px;margin-bottom:18px}.brand-title span{color:var(--primary-blue)}.brand-subtitle{color:#4f5d70;font-size:18px;line-height:1.5}.brand-line{width:52px;height:4px;background:var(--primary-blue);border-radius:5px;margin:28px auto 0}
        .classroom-visual{position:absolute;left:0;right:0;bottom:78px;height:270px}.board{position:absolute;width:110px;height:95px;left:25px;bottom:95px;border:5px solid #d4e0f1;background:#edf4fc}.window{position:absolute;width:90px;height:135px;right:25px;bottom:90px;background:linear-gradient(90deg,#e2ebf8 48%,#bccce4 48%,#bccce4 52%,#e2ebf8 52%)}.window:before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:#bccce4}.main-desk{position:absolute;width:220px;height:16px;bottom:65px;left:80px;background:#5f6d7d;border-radius:3px;box-shadow:0 5px 0 rgba(255,255,255,.6)}.main-desk:before{content:"";position:absolute;width:4px;height:105px;background:#5d6977;left:10px;top:14px;box-shadow:190px 0 #5d6977}.main-chair{position:absolute;width:90px;height:55px;left:155px;bottom:62px;background:var(--primary-blue);border-radius:15px 15px 5px 5px}.main-chair:before{content:"";position:absolute;width:100px;height:14px;background:#1b59b6;top:62px;left:-5px;border-radius:8px}.main-chair:after{content:"";position:absolute;width:4px;height:70px;background:#5d6977;top:70px;left:5px;box-shadow:82px 0 #5d6977}.secure-footer{position:absolute;left:0;right:0;bottom:0;height:78px;background:linear-gradient(90deg,#15489d,#1d5dbc);display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;font-size:16px}
        .login-panel{display:flex;align-items:center;justify-content:center;padding:50px}.login-content{width:100%;max-width:530px}.login-heading{text-align:center}.login-heading h1{font-size:38px;font-weight:800;letter-spacing:-1px}.heading-line{width:52px;height:4px;margin:24px auto;background:var(--primary-blue);border-radius:5px}.login-heading p{color:var(--text-grey);font-size:18px;margin-bottom:38px}.pin-container{display:flex;justify-content:center;gap:22px;margin-bottom:42px}.pin-box{width:84px;height:84px;border:2px solid var(--border-blue);border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 4px 12px rgba(31,95,191,.08)}.pin-dot{width:10px;height:10px;border-radius:50%;background:#475467;opacity:0}.pin-box.active .pin-dot{opacity:1}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{height:74px;border:1px solid var(--border-grey);background:#fff;border-radius:11px;color:var(--text-dark);font-size:25px;font-weight:600;transition:.2s}.key:hover{background:#f2f6fd;border-color:var(--border-blue)}.key:active{transform:scale(.97)}.clear-button{background:#eaf2ff;color:#275ba9;font-size:18px}.enter-button{background:linear-gradient(135deg,#286bd0,#1552b6);color:#fff;border-color:#1552b6;font-size:18px}.message{min-height:70px;margin-top:24px;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 20px;font-size:14px;font-weight:500;opacity:0}.message.error{opacity:1;background:var(--error-bg);color:var(--error-text)}.message.success{opacity:1;background:var(--success-bg);color:var(--success-text)}.shake{animation:shake .35s ease}@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}100%{transform:translateX(0)}}.page-footer{margin-top:42px;color:#667085;font-size:14px}
        @media(max-width:850px){.login-container{grid-template-columns:1fr}.brand-panel{min-height:280px;background:linear-gradient(180deg,#f6f9ff,#e8f0fc)}.classroom-visual,.secure-footer{display:none}.login-panel{padding:40px 25px}} @media(max-width:550px){.login-page{padding:20px 15px}.brand-panel{padding:40px 20px}.brand-title{font-size:36px}.login-heading h1{font-size:32px}.pin-container{gap:10px}.pin-box{width:62px;height:68px}.key{height:62px}}
    </style>
</head>
<body>
<main class="login-page">
<section class="login-container">
<div class="brand-panel">
<div class="brand-content"><div class="school-logo"></div><h1 class="brand-title">Seat<span>Wise</span></h1><p class="brand-subtitle">School Examination<br>Seating Planner</p><div class="brand-line"></div></div>
<div class="classroom-visual"><div class="board"></div><div class="window"></div><div class="main-desk"></div><div class="main-chair"></div></div>
<div class="secure-footer"><span>🔒</span>Secure Admin Portal</div>
</div>
<div class="login-panel"><div class="login-content">
<div class="login-heading"><h1>Admin Login</h1><div class="heading-line"></div><p>Enter your 4-digit PIN to continue</p></div>
<div class="pin-container" id="pinContainer"><div class="pin-box"><div class="pin-dot"></div></div><div class="pin-box"><div class="pin-dot"></div></div><div class="pin-box"><div class="pin-dot"></div></div><div class="pin-box"><div class="pin-dot"></div></div></div>
<div class="keypad"><button class="key" data-number="1">1</button><button class="key" data-number="2">2</button><button class="key" data-number="3">3</button><button class="key" data-number="4">4</button><button class="key" data-number="5">5</button><button class="key" data-number="6">6</button><button class="key" data-number="7">7</button><button class="key" data-number="8">8</button><button class="key" data-number="9">9</button><button class="key clear-button" id="clearButton">← Clear</button><button class="key" data-number="0">0</button><button class="key enter-button" id="loginButton">→ Enter</button></div>
<div class="message" id="message"></div>
</div></div>
</section>
<footer class="page-footer">© 2026 SeatWise. All rights reserved.</footer>
</main>
<script>
const correctPin="1271";let enteredPin="";const pinBoxes=document.querySelectorAll(".pin-box"),message=document.getElementById("message"),pinContainer=document.getElementById("pinContainer");
function updatePinDisplay(){pinBoxes.forEach((box,index)=>box.classList.toggle("active",index<enteredPin.length))}
function clearMessage(){message.textContent="";message.className="message"}
function addDigit(number){if(enteredPin.length>=4)return;enteredPin+=number;clearMessage();updatePinDisplay()}
function clearPin(){enteredPin="";clearMessage();updatePinDisplay()}
function validatePin(){if(enteredPin.length!==4){message.textContent="Please enter the complete 4-digit PIN.";message.className="message error";return}if(enteredPin===correctPin){sessionStorage.setItem("seatwiseAdmin","authenticated");message.textContent="Access granted. Opening dashboard...";message.className="message success";setTimeout(()=>window.location.href="dashboard.html",600)}else{message.textContent="Please enter the correct 4-digit PIN to access the dashboard.";message.className="message error";pinContainer.classList.add("shake");setTimeout(()=>pinContainer.classList.remove("shake"),350);setTimeout(()=>{enteredPin="";updatePinDisplay()},650)}}
document.querySelectorAll("[data-number]").forEach(button=>button.addEventListener("click",()=>addDigit(button.dataset.number)));document.getElementById("clearButton").addEventListener("click",clearPin);document.getElementById("loginButton").addEventListener("click",validatePin);document.addEventListener("keydown",event=>{if(event.key>="0"&&event.key<="9")addDigit(event.key);if(event.key==="Backspace"){enteredPin=enteredPin.slice(0,-1);updatePinDisplay()}if(event.key==="Enter")validatePin();if(event.key==="Escape")clearPin()});
</script>
</body></html>
