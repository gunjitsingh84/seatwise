<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeatWise | Admin Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1f5fbf;--navy:#174c9e;--soft:#eef5ff;--white:#fff;--text:#1e293b;--muted:#667085;--line:#d8e0ea;--danger:#c33d32;--danger-bg:#fff1ef;--success:#218342;--success-bg:#edf9f0}
html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,Arial,Helvetica,sans-serif;background:radial-gradient(circle at 0 100%,#b8d2fa 0,#dce9fb 17%,transparent 17.5%),radial-gradient(circle at 100% 0,#dfe9f8 0,transparent 18%),linear-gradient(135deg,#eaf1fb,#f8fafc);color:var(--text)}button,input{font-family:inherit}button{cursor:pointer}.login-page{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 24px;overflow:hidden}.login-container{width:100%;max-width:1019px;height:min(592px,calc(100vh - 55px));display:grid;grid-template-columns:38% 62%;background:#fff;border-radius:20px;overflow:hidden;border:1px solid #dce4ef;box-shadow:0 22px 52px rgba(28,56,95,.17)}
.brand-panel{position:relative;overflow:hidden;padding:42px 34px 65px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(to bottom,#f6f9ff 0,#e8f0fc 74%,#1c58b5 74%)}.brand-content{text-align:center;position:relative;z-index:2}.school-logo{width:82px;height:82px;margin:0 auto 20px;border:3px solid var(--blue);border-radius:23px 23px 35px 35px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--blue)}.school-logo:before{content:"▰";position:absolute;font-size:36px;transform:translateY(-2px)}.school-logo:after{content:"★ ★ ★";position:absolute;top:8px;font-size:7px;letter-spacing:3px}.brand-title{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin-bottom:13px}.brand-title span{color:var(--blue)}.brand-subtitle{color:#4f5d70;font-size:15px;line-height:1.45}.brand-line{width:44px;height:3px;background:var(--blue);border-radius:5px;margin:20px auto 0}.classroom-visual{position:absolute;left:0;right:0;bottom:60px;height:215px}.board{position:absolute;width:88px;height:76px;left:21px;bottom:77px;border:4px solid #d4e0f1;background:#edf4fc}.window{position:absolute;width:72px;height:108px;right:21px;bottom:72px;background:linear-gradient(90deg,#e2ebf8 48%,#bccce4 48%,#bccce4 52%,#e2ebf8 52%)}.window:before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:#bccce4}.main-desk{position:absolute;width:176px;height:13px;bottom:51px;left:67px;background:#5f6d7d;border-radius:3px}.main-desk:before{content:"";position:absolute;width:3px;height:84px;background:#5d6977;left:8px;top:11px;box-shadow:153px 0 #5d6977}.main-chair{position:absolute;width:72px;height:44px;left:125px;bottom:49px;background:var(--blue);border-radius:12px 12px 4px 4px}.main-chair:before{content:"";position:absolute;width:80px;height:11px;background:#1b59b6;top:50px;left:-4px;border-radius:8px}.main-chair:after{content:"";position:absolute;width:3px;height:56px;background:#5d6977;top:58px;left:4px;box-shadow:65px 0 #5d6977}.secure-footer{position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(90deg,#15489d,#1d5dbc);display:flex;align-items:center;justify-content:center;gap:9px;color:#fff;font-size:13px}
.login-panel{display:flex;align-items:center;justify-content:center;padding:30px 46px}.login-content{width:100%;max-width:450px}.login-heading{text-align:center}.login-heading h1{font-size:32px;font-weight:800;letter-spacing:-.8px}.heading-line{width:44px;height:3px;margin:17px auto;background:var(--blue);border-radius:5px}.login-heading p{color:var(--muted);font-size:14px;margin-bottom:20px}.form-label{display:block;font-size:12px;font-weight:700;margin:0 0 7px;color:#475467}.phone-wrap{margin-bottom:14px}.phone-digits{display:flex;justify-content:center;gap:6px;width:100%}.phone-digit{width:36px;height:48px;border:2px solid #c6d5ea;border-radius:9px;text-align:center;font-size:18px;font-weight:700;color:var(--text);outline:0;background:#fff}.phone-digit:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,191,.1)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.key{height:48px;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--text);font-size:18px;font-weight:600;transition:.15s}.key:hover{background:#f2f6fd;border-color:#b9cbe5}.key:active{transform:scale(.97)}.clear-button{background:#eaf2ff;color:#275ba9;font-size:13px}.enter-button{background:linear-gradient(135deg,#286bd0,#1552b6);color:#fff;border-color:#1552b6;font-size:14px}.login-actions{text-align:center;margin-top:14px}.signup-prompt{color:var(--muted);font-size:12px}.signup-link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700;padding:0}.message{min-height:0;margin-top:10px;border-radius:8px;padding:8px 12px;text-align:center;font-size:12px;font-weight:500;display:none}.message.show{display:block}.message.error{background:var(--danger-bg);color:var(--danger)}.message.success{background:var(--success-bg);color:var(--success)}.shake{animation:shake .35s ease}@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}.page-footer{margin-top:13px;color:#667085;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.show{display:flex}.modal-box{width:100%;max-width:430px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 25px 70px rgba(15,23,42,.25)}.modal-head{padding:18px 22px;border-bottom:1px solid #e4eaf2;display:flex;align-items:center;justify-content:space-between}.modal-head h2{font-size:18px}.close{border:0;background:#f3f6fa;border-radius:8px;width:32px;height:32px;font-size:19px;color:var(--muted)}.modal-body{padding:20px 22px}.modal-body>p{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:16px}.field{margin-bottom:15px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.text-input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 13px;font-size:14px;outline:0;background:#fff}.text-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,191,.1)}.modal-phone-digits{display:flex;justify-content:center;gap:5px}.modal-phone-digit{width:32px;height:42px;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:16px;font-weight:700;outline:0}.modal-phone-digit:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,191,.1)}.modal-footer{display:flex;justify-content:flex-end;gap:9px;padding:15px 22px;border-top:1px solid #e4eaf2}.btn{padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700}.btn-cancel{border:1px solid #d8e0ea;background:#fff;color:var(--text)}.btn-primary{border:0;background:var(--blue);color:#fff}.btn-primary:disabled{opacity:.6;cursor:not-allowed}.modal-message{display:none;padding:9px 11px;border-radius:8px;font-size:12px;margin-bottom:12px}.modal-message.show{display:block}.modal-message.error{background:var(--danger-bg);color:var(--danger)}.modal-message.success{background:var(--success-bg);color:var(--success)}
@media(max-width:850px){html,body{overflow:auto}.login-page{height:auto;min-height:100vh;overflow:visible;padding:20px 15px}.login-container{height:auto;min-height:0;grid-template-columns:1fr}.brand-panel{min-height:225px;padding:35px 20px;background:linear-gradient(180deg,#f6f9ff,#e8f0fc)}.classroom-visual,.secure-footer{display:none}.login-panel{padding:30px 25px 35px}.page-footer{margin-top:12px}}@media(max-width:500px){.login-panel{padding:25px 18px}.phone-digits{gap:4px}.phone-digit{width:29px;height:44px}.key{height:46px}.login-heading h1{font-size:29px}.modal-phone-digits{gap:3px}.modal-phone-digit{width:27px}}
</style>
</head>
<body>
<main class="login-page"><section class="login-container"><div class="brand-panel"><div class="brand-content"><div class="school-logo"></div><h1 class="brand-title">Seat<span>Wise</span></h1><p class="brand-subtitle">School Examination<br>Seating Planner</p><div class="brand-line"></div></div><div class="classroom-visual"><div class="board"></div><div class="window"></div><div class="main-desk"></div><div class="main-chair"></div></div><div class="secure-footer"><span>🔒</span>Secure Admin Portal</div></div><div class="login-panel"><div class="login-content"><div class="login-heading"><h1>Admin Login</h1><div class="heading-line"></div><p>Enter your registered 10-digit phone number</p></div><div class="phone-wrap"><label class="form-label">Phone Number</label><div class="phone-digits" id="loginPhoneDigits"></div></div><div class="keypad"><button class="key" data-number="1">1</button><button class="key" data-number="2">2</button><button class="key" data-number="3">3</button><button class="key" data-number="4">4</button><button class="key" data-number="5">5</button><button class="key" data-number="6">6</button><button class="key" data-number="7">7</button><button class="key" data-number="8">8</button><button class="key" data-number="9">9</button><button class="key clear-button" id="clearButton">← Clear</button><button class="key" data-number="0">0</button><button class="key enter-button" id="loginButton">→ Login</button></div><div class="message" id="message"></div><div class="login-actions"><span class="signup-prompt">New administrator?</span> <button class="signup-link" type="button" onclick="openSignupModal()">Create account</button></div></div></div></section><footer class="page-footer">© 2026 SeatWise. All rights reserved.</footer></main>
<div class="modal" id="signupModal"><div class="modal-box"><div class="modal-head"><h2>Create School Account</h2><button class="close" type="button" onclick="closeModal('signupModal')">×</button></div><form id="signupForm"><div class="modal-body"><p>Create your school and first School Admin account.</p><div class="field"><label for="signupSchoolName">School Name</label><input class="text-input" id="signupSchoolName" type="text" required placeholder="Enter school name"></div><div class="field"><label for="signupSchoolLogo">School Logo <span style="font-weight:400;color:#667085">(Optional)</span></label><input class="text-input" id="signupSchoolLogo" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label for="signupName">Administrator Name</label><input class="text-input" id="signupName" type="text" autocomplete="name" required placeholder="Enter administrator name"></div><div class="field"><label>Phone Number</label><div class="modal-phone-digits" id="signupPhoneDigits"></div></div><div class="modal-message" id="signupMessage"></div></div><div class="modal-footer"><button type="button" class="btn btn-cancel" onclick="closeModal('signupModal')">Cancel</button><button type="submit" class="btn btn-primary" id="signupButton">Create Account</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script>
function buildPhoneInputs(containerId){const c=document.getElementById(containerId);if(!c)return;c.innerHTML='';for(let i=0;i<10;i++){const input=document.createElement('input');input.className=containerId==='loginPhoneDigits'?'phone-digit':'modal-phone-digit';input.type='text';input.inputMode='numeric';input.maxLength=1;input.pattern='[0-9]';input.autocomplete='off';input.setAttribute('aria-label','Phone digit '+(i+1));input.addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,1);if(this.value&&i<9)c.querySelectorAll('input')[i+1].focus()});input.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!this.value&&i>0)c.querySelectorAll('input')[i-1].focus();if(e.key==='ArrowLeft'&&i>0)c.querySelectorAll('input')[i-1].focus();if(e.key==='ArrowRight'&&i<9)c.querySelectorAll('input')[i+1].focus()});input.addEventListener('paste',function(e){e.preventDefault();const d=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,10),a=c.querySelectorAll('input');d.split('').forEach((x,j)=>{if(i+j<10)a[i+j].value=x});if(d.length)a[Math.min(i+d.length,10)-1].focus()});c.appendChild(input)}}
function getPhone(id){return Array.from(document.querySelectorAll('#'+id+' input')).map(i=>i.value).join('')}function setPhone(id,v){const d=String(v||'').replace(/\D/g,'').slice(0,10);document.querySelectorAll('#'+id+' input').forEach((i,n)=>i.value=d[n]||'')}function closeModal(id){document.getElementById(id)?.classList.remove('show')}function openSignupModal(){document.getElementById('signupForm').reset();setPhone('signupPhoneDigits','');const m=document.getElementById('signupMessage');m.textContent='';m.className='modal-message';document.getElementById('signupModal').classList.add('show');document.querySelector('#signupPhoneDigits input')?.focus()}function showSignupMessage(t,type='error'){const m=document.getElementById('signupMessage');m.textContent=t;m.className='modal-message show '+type}function readLogoFile(){return new Promise((resolve,reject)=>{const f=document.getElementById('signupSchoolLogo')?.files?.[0];if(!f)return resolve(null);if(f.size>1024*1024)return reject(new Error('School logo must be 1 MB or smaller.'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Unable to read the logo file.'));r.readAsDataURL(f)})}
async function login(){const phone=getPhone('loginPhoneDigits');if(phone.length!==10){alert('Please enter the complete 10-digit phone number.');return}const btn=document.getElementById('loginButton');btn.disabled=true;const{data,error}=await findAdminByPhone(phone);if(error){console.error(error);alert('Unable to connect to the account database. Please try again.');btn.disabled=false;return}if(!data){alert('No administrator account was found for this phone number.');document.getElementById('loginPhoneDigits')?.classList.add('shake');setTimeout(()=>document.getElementById('loginPhoneDigits')?.classList.remove('shake'),350);btn.disabled=false;return}let school=null;if(data.school_id){const r=await seatwiseDb.from('schools').select('id,school_name,school_logo_url,is_active').eq('id',data.school_id).maybeSingle();if(r.error){console.error(r.error);alert('Unable to load the school account. Please try again.');btn.disabled=false;return}school=r.data}if(!school||school.is_active===false){alert('This school account is inactive. Please contact the administrator.');btn.disabled=false;return}setSeatwiseSession({...data,school_name:school.school_name,school_logo_url:school.school_logo_url});sessionStorage.setItem('seatwiseAdmin','authenticated');await logActivity('LOGIN_SUCCESS',{method:'phone'},data.id);window.location.href='dashboard.html'}
async function handleSignup(e){e.preventDefault();const schoolName=document.getElementById('signupSchoolName').value.trim(),name=document.getElementById('signupName').value.trim(),phone=getPhone('signupPhoneDigits');if(!schoolName||!name||phone.length!==10){showSignupMessage('Please enter the school name, administrator name and complete 10-digit phone number.');return}const btn=document.getElementById('signupButton');btn.disabled=true;btn.textContent='Creating...';try{const{data:existing,error:lookupError}=await findAdminByPhone(phone);if(lookupError)throw new Error('Unable to check the phone number. Please try again.');if(existing)throw new Error('This phone number is already registered.');const logo=await readLogoFile();const{data:school,error:schoolError}=await seatwiseDb.from('schools').insert({school_name:schoolName,school_logo_url:logo}).select('id,school_name,school_logo_url,is_active').single();if(schoolError)throw new Error(schoolError.message||'Unable to create school.');const{data:user,error:userError}=await seatwiseDb.from('admin_users').insert({name,phone,school_id:school.id}).select('id,name,phone,school_id').single();if(userError){await seatwiseDb.from('schools').delete().eq('id',school.id);throw new Error(userError.message||'Unable to create administrator account.')}await logActivity('SCHOOL_ACCOUNT_CREATED',{school_id:school.id,school_name:schoolName},user.id);showSignupMessage('School account created successfully. You can now log in with your phone number.','success');setTimeout(()=>{closeModal('signupModal');setPhone('loginPhoneDigits',phone);document.querySelector('#loginPhoneDigits input:last-child')?.focus()},900)}catch(err){console.error(err);showSignupMessage(err.message||'Unable to create account. Please try again.')}finally{btn.disabled=false;btn.textContent='Create Account'}}
buildPhoneInputs('loginPhoneDigits');buildPhoneInputs('signupPhoneDigits');document.querySelectorAll('.key[data-number]').forEach(b=>b.addEventListener('click',()=>{const a=document.querySelectorAll('#loginPhoneDigits input'),i=Array.from(a).findIndex(x=>!x.value);if(i>=0){a[i].value=b.dataset.number;if(i<9)a[i+1].focus()}}));document.getElementById('clearButton').addEventListener('click',()=>{setPhone('loginPhoneDigits','');document.querySelector('#loginPhoneDigits input')?.focus()});document.getElementById('loginButton').addEventListener('click',login);document.getElementById('signupForm').addEventListener('submit',handleSignup);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key>='0'&&e.key<='9'){const a=document.querySelectorAll('#loginPhoneDigits input'),i=Array.from(a).findIndex(x=>!x.value);if(i>=0){a[i].value=e.key;if(i<9)a[i+1].focus()}}if(e.key==='Backspace'){const a=document.querySelectorAll('#loginPhoneDigits input'),i=Array.from(a).findLastIndex(x=>x.value);if(i>=0){a[i].value='';a[i].focus()}}if(e.key==='Enter')login();if(e.key==='Escape')closeModal('signupModal')});
</script>
</body></html>
