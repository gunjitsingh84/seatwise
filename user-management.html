<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeatWise | User Management</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#1e293b}.sidebar{position:fixed;inset:0 auto 0 0;width:270px;background:linear-gradient(180deg,#1f5fbf,#174c9e);color:#fff}.brand{height:92px;padding:0 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ffffff24}.brand-icon{width:46px;height:46px;border:1px solid #ffffff55;border-radius:13px;display:grid;place-items:center}.brand-name{font-size:27px;font-weight:800}.brand-name span{color:#dceaff}.nav{padding:28px 15px;visibility:hidden}.nav.seatwise-nav-ready{visibility:visible!important}.nav-label{font-size:11px;letter-spacing:1px;color:#ffffff8c;padding:0 13px 12px}.nav a{display:flex;gap:14px;padding:14px 15px;margin-bottom:6px;border-radius:10px;color:#ffffffdc;text-decoration:none}.nav a.active{background:#fff;color:#1f5fbf;font-weight:700}.nav-icon{width:24px}.main{margin-left:270px;min-height:100vh}.topbar{height:92px;background:#fff;border-bottom:1px solid #e4eaf2;display:flex;align-items:center;justify-content:space-between;padding:0 40px}.topbar h1{margin:0;font-size:25px}.topbar p{margin:5px 0 0;color:#667085;font-size:13px}.avatar{width:42px;height:42px;border-radius:50%;background:#e6efff;color:#1f5fbf;display:grid;place-items:center;font-weight:800}.content{padding:34px 40px}.intro{margin-bottom:24px}.intro h2{margin:0 0 7px;font-size:24px}.intro p{margin:0;color:#667085}.panel{background:#fff;border:1px solid #e4eaf2;border-radius:16px;padding:25px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.button{border:0;background:#1f5fbf;color:#fff;padding:11px 17px;border-radius:9px;font-weight:700;cursor:pointer}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px;border-bottom:1px solid #eef1f5}.table th{font-size:12px;text-transform:uppercase;color:#667085}.badge{padding:6px 9px;border-radius:20px;font-size:11px;font-weight:700}.active-b{background:#eaf9f1;color:#16834d}.inactive-b{background:#fff0ef;color:#a83b31}.actions{display:flex;gap:8px}.small{border:1px solid #dbe3ec;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;color:#1f5fbf}.modal{display:none;position:fixed;inset:0;background:#0f172a73;align-items:center;justify-content:center}.modal.show{display:flex}.box{width:min(440px,92%);background:#fff;border-radius:16px;padding:25px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:44px;border:1px solid #dbe3ec;border-radius:9px;padding:0 12px;font:inherit}.message{display:none;margin-top:15px;padding:12px;border-radius:9px}.message.show{display:block}.success{background:#eaf9f1;color:#16834d}.error{background:#fff0ef;color:#a83b31}.footer{text-align:center;color:#667085;font-size:12px;padding:28px}@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0}.nav{display:flex;overflow:auto;padding:12px}.nav-label{display:none}.sidebar>div:last-child{display:none}.topbar{padding:0 18px}.content{padding:24px 18px}.toolbar{align-items:flex-start;gap:12px;flex-direction:column}}</style></head><body><aside class="sidebar"><div class="brand"><div class="brand-icon">▦</div><div class="brand-name">Seat<span>Wise</span></div></div><nav class="nav"></nav><div style="padding:20px;border-top:1px solid #ffffff24"><strong id="adminName">Administrator</strong><div id="schoolLabel" style="font-size:12px;color:#ffffffa6;margin-top:4px">School Admin</div><button onclick="seatwiseLogout()" style="margin-top:12px;border:0;background:transparent;color:#fff;cursor:pointer">Logout ↪</button></div></aside><main class="main"><header class="topbar"><div><h1>User Management</h1><p>Manage administrators who have access to this school.</p></div><div class="avatar" id="headerAvatar">A</div></header><section class="content"><div class="intro"><h2>School Administrators</h2><p>Only administrators associated with your school are shown.</p></div><section class="panel"><div class="toolbar"><strong id="count">Loading...</strong><button class="button" onclick="openModal()">+ Add Administrator</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div><div id="message" class="message"></div></section><div class="footer">© 2026 SeatWise. All rights reserved.</div></section></main><div class="modal" id="modal"><div class="box"><h3 id="modalTitle">Add Administrator</h3><div class="field"><label>Name</label><input id="nameInput"></div><div class="field"><label>Phone Number</label><input id="phoneInput" maxlength="10" inputmode="numeric"></div><div style="text-align:right"><button class="button" style="background:#fff;color:#1f5fbf;border:1px solid #dbe3ec" onclick="closeModal()">Cancel</button> <button class="button" onclick="saveUser()">Save</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script src="js/navigation.js"></script><script>const user=requireSeatwiseLogin();if(!user)throw new Error('Not authenticated');const db=seatwiseDb,schoolId=user.school_id;let users=[],editingId=null;function init(){document.getElementById('adminName').textContent=user.name||'Administrator';document.getElementById('schoolLabel').textContent=user.school_name||'School Admin';document.getElementById('headerAvatar').textContent=(user.name||'A').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();loadUsers()}function show(t,k='success'){const e=document.getElementById('message');e.textContent=t;e.className='message show '+k;setTimeout(()=>e.className='message',3500)}async function loadUsers(){const{data,error}=await db.from('admin_users').select('id,name,phone,school_id,is_active').eq('school_id',schoolId).order('name');if(error){console.error(error);show(error.message,'error');return}users=data||[];document.getElementById('count').textContent=`${users.length} administrator${users.length===1?'':'s'}`;document.getElementById('usersBody').innerHTML=users.map(u=>`<tr><td><strong>${esc(u.name)}</strong>${u.id===user.id?' <small>(You)</small>':''}</td><td>${esc(u.phone)}</td><td><span class="badge ${u.is_active===false?'inactive-b':'active-b'}">${u.is_active===false?'Inactive':'Active'}</span></td><td><div class="actions"><button class="small" onclick="editUser('${u.id}')">Edit</button><button class="small" onclick="toggleUser('${u.id}')">${u.is_active===false?'Activate':'Deactivate'}</button></div></td></tr>`).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openModal(id=null){editingId=id;document.getElementById('modalTitle').textContent=id?'Edit Administrator':'Add Administrator';const u=id?users.find(x=>x.id===id):null;document.getElementById('nameInput').value=u?.name||'';document.getElementById('phoneInput').value=u?.phone||'';document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show');editingId=null}function editUser(id){openModal(id)}async function saveUser(){const name=document.getElementById('nameInput').value.trim(),phone=document.getElementById('phoneInput').value.replace(/\D/g,'');if(!name||!/^[0-9]{10}$/.test(phone)){show('Enter a name and valid 10-digit phone number.','error');return}const duplicate=users.find(x=>x.phone===phone&&x.id!==editingId);if(duplicate){show('This phone number is already in use.','error');return}const result=editingId?await db.from('admin_users').update({name,phone}).eq('id',editingId).eq('school_id',schoolId):await db.from('admin_users').insert({name,phone,school_id:schoolId,is_active:true});if(result.error){show(result.error.message,'error');return}closeModal();show(editingId?'Administrator updated.':'Administrator added.');loadUsers()}async function toggleUser(id){if(id===user.id){show('You cannot deactivate your own account.','error');return}const u=users.find(x=>x.id===id);if(!u)return;const{error}=await db.from('admin_users').update({is_active:u.is_active===false}).eq('id',id).eq('school_id',schoolId);if(error){show(error.message,'error');return}show(u.is_active===false?'Administrator activated.':'Administrator deactivated.');loadUsers()}init();</script></body></html>
