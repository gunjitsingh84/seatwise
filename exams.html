<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeatWise | Exams</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--blue:#1f5fbf;--navy:#174c9e;--bg:#f4f7fb;--text:#1e293b;--muted:#667085;--line:#e4eaf2;--green:#16834d;--soft:#eef5ff}body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}a{text-decoration:none}.sidebar{position:fixed;inset:0 auto 0 0;width:270px;background:linear-gradient(180deg,var(--blue),var(--navy));color:#fff;display:flex;flex-direction:column}.brand{height:92px;padding:0 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ffffff24}.brand-icon{width:46px;height:46px;border:1px solid #ffffff55;border-radius:13px;display:grid;place-items:center;font-size:24px}.brand-name{font-size:27px;font-weight:800}.brand-name span{color:#dceaff}.nav{padding:28px 15px;flex:1}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#ffffff8c;padding:0 13px 12px}.nav a{display:flex;align-items:center;gap:14px;padding:14px 15px;margin-bottom:6px;border-radius:10px;color:#ffffffdc;font-size:15px}.nav a:hover{background:#ffffff1a}.nav a.active{background:#fff;color:var(--blue);font-weight:700}.nav-icon{width:24px;text-align:center}.sidebar-footer{padding:20px;border-top:1px solid #ffffff24}.profile{display:flex;align-items:center;gap:12px}.avatar,.header-avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:800}.profile-info{flex:1}.profile-info strong,.profile-info span{display:block}.profile-info strong{font-size:14px}.profile-info span{font-size:12px;color:#ffffffa6;margin-top:4px}.logout{border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer}.main{margin-left:270px;min-height:100vh}.topbar{height:92px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px}.title h1{font-size:25px;font-weight:800}.title p{font-size:13px;color:var(--muted);margin-top:5px}.content{padding:34px 40px 45px;max-width:1500px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel-head h2{font-size:20px}.muted{color:var(--muted);font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);font-size:13px}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf9f2;color:var(--green);font-size:11px;font-weight:700}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0}.nav{display:flex;overflow:auto;padding:12px}.nav-label{display:none}.nav a{white-space:nowrap;margin:0}.sidebar-footer{display:none}.topbar{padding:0 18px}.content{padding:24px 18px}.panel{overflow:auto}.table{min-width:650px}}</style></head><body><aside class="sidebar"><div class="brand"><div class="brand-icon">▦</div><div class="brand-name">Seat<span>Wise</span></div></div><nav class="nav"><div class="nav-label">Main Menu</div><a href="dashboard.html"><span class="nav-icon">▦</span>Dashboard</a><a href="students.html"><span class="nav-icon">♙</span>Classes &amp; Sections</a><a href="rooms.html"><span class="nav-icon">⌂</span>Rooms</a><a href="subjects.html"><span class="nav-icon">◈</span>Subjects</a><a href="exam-planner.html"><span class="nav-icon">◫</span>Exam Planner</a><a href="exams.html" class="active"><span class="nav-icon">▤</span>Exams</a><a href="#"><span class="nav-icon">◧</span>Seating Plans</a><a href="#"><span class="nav-icon">◷</span>History</a></nav><div class="sidebar-footer"><div class="profile"><div class="avatar" id="adminAvatar">A</div><div class="profile-info"><strong id="adminName">Administrator</strong><span>School Admin</span></div><button class="logout" onclick="logout()">↪</button></div></div></aside><main class="main"><header class="topbar"><div class="title"><h1>Exams</h1><p>Finalized examination schedule ready for the next stage.</p></div><div class="header-avatar" id="headerAvatar">A</div></header><section class="content"><section class="panel"><div class="panel-head"><div><h2>Finalized Exams</h2><p class="muted">Examinations created from finalized Exam Planner schedules.</p></div><span id="sessionBadge" class="badge"></span></div><div id="examContent" class="empty">Loading exams...</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script>const user=requireSeatwiseLogin();if(!user)throw new Error('Not authenticated');function initials(n){const p=(n||'Administrator').trim().split(/\s+/).filter(Boolean);return p.length>1?(p[0][0]+p[p.length-1][0]).toUpperCase():p[0][0].toUpperCase()}document.getElementById('adminName').textContent=user.name||'Administrator';document.getElementById('adminAvatar').textContent=initials(user.name);document.getElementById('headerAvatar').textContent=initials(user.name);const session=getCurrentAcademicSession();document.getElementById('sessionBadge').textContent=session;function esc(v){return String(v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})}async function load(){const{data,error}=await seatwiseDb.from('exams').select('*').eq('academic_session',session).order('exam_date').order('class_number');const el=document.getElementById('examContent');if(error){el.textContent='Unable to load finalized exams. Check the exams table and RLS policies.';return}if(!data?.length){el.innerHTML='<div class="empty">No finalized exams yet.<br><br>Finalize a plan from Exam Planner to populate this section.</div>';return}const groups={};data.forEach(x=>{groups[x.exam_date]??=[];groups[x.exam_date].push(x)});el.className='';el.innerHTML='<table class="table"><thead><tr><th>Date</th><th>Day</th><th>Class</th><th>Subject</th><th>Status</th></tr></thead><tbody>'+data.map(x=>`<tr><td>${fmt(x.exam_date)}</td><td>${new Date(x.exam_date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long'})}</td><td>Class ${x.class_number}</td><td>${esc(x.subject_name)}</td><td><span class="badge">${esc(x.status)}</span></td></tr>`).join('')+'</tbody></table>'}load();</script></body></html>
