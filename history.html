<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeatWise | History</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#1e293b}.main{min-height:100vh}.topbar{height:92px;background:#fff;border-bottom:1px solid #e4eaf2;display:flex;align-items:center;justify-content:space-between;padding:0 40px}.topbar h1{margin:0;font-size:25px}.topbar p{margin:5px 0 0;color:#667085;font-size:13px}.avatar{width:42px;height:42px;border-radius:50%;background:#e6efff;color:#1f5fbf;display:grid;place-items:center;font-weight:800}.content{padding:34px 40px}.panel{background:#fff;border:1px solid #e4eaf2;border-radius:16px;padding:25px}.empty{text-align:center;padding:70px 20px;color:#667085}.footer{text-align:center;color:#667085;font-size:12px;padding:28px}@media(max-width:650px){.topbar{padding:0 18px}.content{padding:24px 18px}}</style></head><body><main class="main"><header class="topbar"><div><h1>History</h1><p>View activity history for your school.</p></div><div class="avatar" id="headerAvatar">A</div></header><section class="content"><section class="panel"><div class="empty">Activity history will appear here as SeatWise actions are recorded.</div></section><div class="footer">© 2026 SeatWise. All rights reserved.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script>const user=requireSeatwiseLogin();if(!user)throw new Error('Not authenticated');document.getElementById('headerAvatar').textContent=(user.name||'A').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();</script></body></html>
