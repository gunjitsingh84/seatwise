<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeatWise | History</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#1e293b}.sidebar{position:fixed;inset:0 auto 0 0;width:270px;background:linear-gradient(180deg,#1f5fbf,#174c9e);color:#fff}.brand{height:92px;padding:0 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ffffff24}.brand-icon{width:46px;height:46px;border:1px solid #ffffff55;border-radius:13px;display:grid;place-items:center;font-size:24px}.brand-name{font-size:27px;font-weight:800}.brand-name span{color:#dceaff}.nav{padding:28px 15px;visibility:hidden}.nav.seatwise-nav-ready{visibility:visible!important}.main{margin-left:270px;min-height:100vh}.topbar{height:92px;background:#fff;border-bottom:1px solid #e4eaf2;display:flex;align-items:center;justify-content:space-between;padding:0 40px}.topbar h1{margin:0;font-size:25px}.topbar p{margin:5px 0 0;color:#667085;font-size:13px}.avatar{width:42px;height:42px;border-radius:50%;background:#e6efff;color:#1f5fbf;display:grid;place-items:center;font-weight:800}.content{padding:34px 40px}.panel{background:#fff;border:1px solid #e4eaf2;border-radius:16px;padding:25px}.empty{text-align:center;padding:70px 20px;color:#667085}.footer{text-align:center;color:#667085;font-size:12px;padding:28px}@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0}.topbar{padding:0 18px}.content{padding:24px 18px}}</style></head><body><aside class="sidebar"><div class="brand"><div class="brand-icon">▦</div><div class="brand-name">Seat<span>Wise</span></div></div><nav class="nav"></nav><div style="padding:20px;border-top:1px solid #ffffff24"><strong id="adminName">Administrator</strong><div id="schoolLabel" style="font-size:12px;color:#ffffffa6;margin-top:4px">School Admin</div><button onclick="seatwiseLogout()" style="margin-top:12px;border:0;background:transparent;color:#fff;cursor:pointer">Logout ↪</button></div></aside><main class="main"><header class="topbar"><div><h1>History</h1><p>View activity history for your school.</p></div><div class="avatar" id="headerAvatar">A</div></header><section class="content"><section class="panel"><div class="empty">Activity history will appear here as SeatWise actions are recorded.</div></section><div class="footer">© 2026 SeatWise. All rights reserved.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><script src="js/navigation.js"></script><script>const user=requireSeatwiseLogin();if(!user)throw new Error('Not authenticated');document.getElementById('adminName').textContent=user.name||'Administrator';document.getElementById('schoolLabel').textContent=user.school_name||'School Admin';document.getElementById('headerAvatar').textContent=(user.name||'A').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();</script></body></html>
